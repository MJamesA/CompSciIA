{% extends 'base.html' %}
{% block title %}Student Login Page {% endblock %}

{% block content %}
<title>Login Page</title>

<div class="container">
    <div class="row justify-content-center">
<div class="col-4">
    <div class="card mt-5 p-5">

<form class="mt-3" action="{{ url_for('student_routes.student_login') }}" method="POST">
    <h2 class="d-flex justify-content-center">Student Login</h2>
    <div class="mt-5 mb-3">
      <label for="name" class="form-label">Last Name:</label>
      <input type="text" class="form-control" id="name" aria-describedby="emailHelp" name="name">
    </div>
    <div class="mb-3">
      <label for="idcard" class="form-label">ID Card Number:</label>
      <input type="number" class="form-control" name="id_card" placeholder="ID Card Number" required>
    </div>
    <button type="submit" class="mt-3 btn btn-primary form-control">Login</button>
  </form>
</div>
</div>
</div>
</div>

{% endblock %}
