<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>
</head>
<body>
    <h1>Profile</h1>
    <form method="POST" action="{{ url_for('student_profile') }}">
        <input type="text" name="first_name" value="{{ student.FirstName }}" required>
        <input type="text" name="last_name" value="{{ student.LastName }}" required>
        <button type="submit">Update Profile</button>
    </form>
    <a href="{{ url_for('student_dashboard') }}">Back to Dashboard</a>
</body>
</html>
