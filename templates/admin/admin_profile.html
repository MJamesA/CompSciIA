{% extends 'AdminSidebar.html' %}
{% block title %}Admin Login Page {% endblock %}

{% block content %}

<div class="container">
    <div class="row justify-content-center">
<div class="col-4">
    <h1>Admin Profile</h1>
    <form method="POST">
        <label for="first_name">First Name</label>
        <input class="form-control" type="text" name="first_name" value="{{ admin.Firstname }}" required><br>

        <label for="last_name">Last Name</label>
        <input class="form-control" type="text" name="last_name" value="{{ admin.Lastname }}" required><br>

        <label for="username">Username</label>
        <input class="form-control" type="text" name="username" value="{{ admin.Username }}" required><br>

        <label for="password">Password</label>
        <input class="form-control" type="text" name="password" ><br>

        <button class="btn btn-primary" type="submit">Update Student</button>
    </form>
    <a href="{{ url_for('admin_routes.admin_user_list') }}">Back to Admins List</a>
</div>
</div>
</div>
{% endblock %}
