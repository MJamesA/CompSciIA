{% extends 'AdminSidebar.html' %}
{% block title %}Admin Login Page {% endblock %}

{% block content %}

<div class="container">
    <div class="row justify-content-center">
<div class="col-4">
    <h1>Student Profile</h1>
    <form method="POST">
        <label for="first_name">First Name</label>
        <input class="form-control" type="text" name="first_name" value="{{ student.Firstname }}" required><br>

        <label for="last_name">Last Name</label>
        <input class="form-control" type="text" name="last_name" value="{{ student.Lastname }}" required><br>

        <label for="id_card_number">ID Card Number</label>
        <input class="form-control" type="text" name="id_card_number" value="{{ student.idcardnumber }}" required><br>

        <button class="btn btn-primary" type="submit">Update Student</button>
    </form>
    <a href="{{ url_for('admin_routes.admin_students') }}">Back to Students List</a>
</div>
</div>
</div>
{% endblock %}
